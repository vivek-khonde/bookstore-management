<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}">    
<head>
<meta charset="ISO-8859-1">
<title>Available Books</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<section layout:fragment="content">
	<table class="table table-bordered ">
  <thead class="table table-dark table-striped table-hover">
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Author</th>
      <th scope="col">Price</th>
      <th scope="col">Description</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="book :${book}">
    	 <td th:text="${book.id}"></td>
    	 <td th:text="${book.name}"></td>
    	  <td th:text="${book.author}"></td>
    	   <td th:text="${book.price}"></td>
    	    <td th:text="${book.description}"></td>
    	    <td> 
    	    <!-- <a style="color:#0d6efd" th:href="@{/editMyBook/{id}(id=${book.id})}"><i class="fa-solid fa-pen-to-square ms-5"></i></a> -->
      		<a style="color: #dc3545" th:href="@{/deleteMyBook/{id}(id=${book.id})}"><i class="fa-solid fa-trash ms-5"></i></a>
    	    </td>
    </tr>
  </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</section>
</html>
