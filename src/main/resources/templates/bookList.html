<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}">
<head>
    <meta charset="UTF-8">
    <title>Available Books</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<section layout:fragment="content">
    <div class="container mt-4">
        <h2 class="mb-4">Available Books</h2>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Author</th>
                    <th scope="col">Price</th>
                    <th scope="col">Description</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${book}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.name}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.price}"></td>
                    <td th:text="${book.description}"></td>
                    <td>
                        <!-- USER can Add To MyBook -->
                        <a th:if="${session.loggedInUser != null and session.loggedInUser.role == 'USER'}"
                           class="btn btn-secondary btn-sm"
                           th:href="@{/mylist/{id}(id=${book.id})}">
                            Add To MyBook
                        </a>

                        <!-- ADMIN can Edit -->
                        <a th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}"
                           style="color:#0d6efd; text-decoration: none;"

                           th:href="@{/editBook/{id}(id=${book.id})}">
                            <i class="fa-solid fa-pen-to-square ms-3"></i>
                        </a>

                        <!-- ADMIN can Delete -->
                        <a th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}"
                           style="color:#dc3545"
                           th:href="@{/deleteBook/{id}(id=${book.id})}">
                            <i class="fa-solid fa-trash ms-3"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</section>
<!-- <a style="color:#0d6efd" th:href="@{/editMyBook/{id}(id=${book.id})}"><i class="fa-solid fa-pen-to-square ms-5"></i></a>
 -->
</html>
