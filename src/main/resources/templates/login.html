<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<section layout:fragment="content">
	<div class="container mt-5" style="max-width: 500px;">
	 <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
            <div class="card-header text-center">
                <p class="fs-4 mb-0">Login</p>
            </div>
                 <!-- ✅ Display error message (from your old file) -->
            <div th:if="${errorMsg}" class="alert alert-danger text-center mt-2" 
                 th:text="${errorMsg}"></div>

            <!-- <div th:if="${param.logout}" class="alert alert-success text-center mt-2">
                Logout successful.
            </div> -->

            <div class="card-body">
                <!-- ✅ Your working form with Thymeleaf binding -->
                <form th:action="@{/loginForm}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" th:field="*{email}" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" th:field="*{password}" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn w-100 mt-m" style="background-color: #6610f2; color: white;">Login</button>
                </form>
            </div>
                 <div class="card-footer text-center">Don't have an account?
                <a href="regForm" class="text-decoration-none">Register</a><br>
                
            </div>
			</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</section>
</html>
