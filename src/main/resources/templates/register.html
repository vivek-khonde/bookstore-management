<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<section layout:fragment="content">
	<div class="container mt-5" style="max-width: 600px;">
	 <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
            <div class="card-header text-center">
                <p class="fs-4 mb-0">Register</p>
            </div>
                 <!-- ✅ Success and Error Messages -->
            <div class="card-body">
                <div th:if="${successMsg}" class="alert alert-success text-center" th:text="${successMsg}"></div>
                <div th:if="${errorMsg}" class="alert alert-danger text-center" th:text="${errorMsg}"></div>

                <!-- ✅ Registration Form -->
                <form th:action="@{/regForm}" th:object="${user}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" 
                        
                        class="form-control" placeholder="Enter email" required>
                        <span th:if="${#fields.hasErrors('email')}" 
      						th:errors="*{email}" 
     						 style="color:red"></span>    
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" required minlength="6" maxlength="20" class="form-control" placeholder="Enter password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" th:field="*{phoneno}" required minlength="10" maxlength="10" class="form-control" placeholder="Enter phone number">
                    </div>

                    <button type="submit" class="btn w-100 mt-3" style="background-color: #6610f2; color: white;">Register</button>
                </form>
            </div>

            <div class="card-footer text-center">
                Already have an account?
                <a href="loginForm" class="text-decoration-none">Login</a><br>
                
            </div>
			</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</section>
</html>
