<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{index}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<section layout:fragment="content">
<!-- Display all orders in a table -->
<div class="container mt-4">
    <h2 class="mb-4">Placed Orders</h2>
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark ">
            <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Books</th>
                <th>Total Price</th>
                <th>Status</th>
                <th>Order Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterate through orders and display them -->
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderId}"></td>
                <td th:text="${order.user.name}"></td> <!-- Assuming User has a `name` field -->
                <td>
                    <ul>
                        <li th:each="book : ${order.books}" th:text="${book.name}"></li> <!-- Assuming MyBookList has a `name` field -->
                    </ul>
                </td>
                 <td th:text="${order.totalPrice}"></td> 
                <!-- <td th:text="${#numbers.formatDecimal(order.totalPrice, 2, 1, 'POINT')}"></td> -->
                <td th:text="${order.orderStatus}"></td>
                <td th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd')}"></td> <!-- Formatting the date -->
                <td>
                    <!-- Action buttons for Edit and Delete -->
                    <a style="color:#0d6efd" th:href="@{/createOrder/{id}(id=${order.orderId})}"><i class="fa-solid fa-pen-to-square ms-5"></i></a>
                    <a style="color: #dc3545" th:href="@{/deleteOrder/{id}(id=${order.orderId})}"><i class="fa-solid fa-trash ms-5"></i></a>
                    
                    <!-- Status Update Form -->
                    <form th:action="@{/orders/updateStatus}" method="POST" class="d-inline ms-4">
                        <input type="hidden" name="orderId" th:value="${order.orderId}"/>
                        <select name="status" required>
                            <option value="Pending" th:selected="${order.orderStatus == 'Pending'}">Pending</option>
                            <option value="Shipped" th:selected="${order.orderStatus == 'Shipped'}">Shipped</option>
                            <option value="Completed" th:selected="${order.orderStatus == 'Completed'}">Completed</option>
                        </select>
                        <!-- <button type="submit" class="btn btn-sm" style="background-color: #6610f2; color: white;">Update Status</button> -->
                    	<!-- ✅ Replaced the text button with an icon -->
        <button type="submit" 
                class="btn btn-sm" 
                style="color: #198754; margin-left: 8px;">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</section>
</html>
